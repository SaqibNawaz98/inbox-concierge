# Optional Postgres: learning ("Remember") + saved custom buckets.
#
# Postgres only (default):     docker compose up -d postgres
# App + Postgres (full stack): docker compose --profile app up --build
# DATABASE_URL uses hostname `postgres` on the Compose network.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
      POSTGRES_DB: inbox_concierge
    volumes:
      - inbox_concierge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox_concierge"]
      interval: 3s
      timeout: 5s
      retries: 10

  web:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://inbox:inbox@postgres:5432/inbox_concierge
    env_file:
      - path: .env.docker
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  inbox_concierge_pg:
